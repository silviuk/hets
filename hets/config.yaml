name: "HETS (EVCC Test Token Auto-Sync)"
slug: "hets"
description: "Automatically extracts and updates the renewed EVCC test sponsor token into EVCC"
url: "https://github.com/silviuk/hets"
version: "1.0.7"
startup: "services"
boot: "auto"
init: false
host_network: true
apptype: "app"
app_type: "app"
stage: "stable"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
options:
  evcc_url: ""
  notify_ha: true
schema:
  evcc_url: "str?"
  notify_ha: "bool"
homeassistant_api: true
hassio_api: true
